<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة رنيم</title>
    
    <!-- الخطوط العربية -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة التأثيرات -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary-red: #ff2a5f;
            --dark-burgundy: #1a0006;
            --rose-gold: #ffb8c6;
            --paper-bg: #fff8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #3d000d, #0f0003);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* --- شاشة الباسورد --- */
        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 0, 3, 0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 42, 95, 0.3);
            padding: 40px 30px;
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 42, 95, 0.2);
            max-width: 400px;
            width: 90%;
        }

        .login-card h2 {
            color: var(--rose-gold);
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .login-card input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
            color: #fff;
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .login-card button {
            background: linear-gradient(135deg, #ff2a5f, #b30032);
            border: none;
            color: #fff;
            padding: 12px 35px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 42, 95, 0.4);
            transition: transform 0.2s;
        }

        .login-card button:hover {
            transform: scale(1.05);
        }

        .error-msg {
            color: #ff4757;
            font-size: 0.9rem;
            margin-top: 10px;
            display: none;
        }

        /* --- المحتوى الرئيسي --- */
        .main-container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            display: none;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .header-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .header-title h1 {
            font-size: 2.8rem;
            color: var(--rose-gold);
            text-shadow: 0 0 15px rgba(255, 184, 198, 0.4);
            margin-bottom: 10px;
        }

        /* تنبيه عيد الميلاد في الأعلى */
        .bday-banner {
            background: rgba(255, 42, 95, 0.15);
            border: 1px solid rgba(255, 42, 95, 0.4);
            padding: 12px 20px;
            border-radius: 15px;
            text-align: center;
            color: var(--rose-gold);
            font-size: 1.1rem;
            margin-bottom: 30px;
            backdrop-filter: blur(5px);
        }

        /* --- العداد الزمني الفاخر --- */
        .counter-section {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            padding: 30px 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-bottom: 50px;
            text-align: center;
        }

        .counter-section h3 {
            color: var(--rose-gold);
            margin-bottom: 25px;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }

        .timer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .time-card {
            background: linear-gradient(145deg, rgba(255, 42, 95, 0.15), rgba(0, 0, 0, 0.4));
            border: 1px solid rgba(255, 42, 95, 0.3);
            border-radius: 20px;
            padding: 20px 10px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(255, 42, 95, 0.1);
        }

        .time-value {
            font-size: 2.5rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--primary-red);
            display: block;
        }

        .time-label {
            font-size: 0.9rem;
            color: var(--rose-gold);
            margin-top: 5px;
            display: block;
        }

        /* --- الورقة الرومانسية الإبداعية --- */
        .letter-section {
            margin-bottom: 40px;
        }

        .section-title {
            text-align: center;
            font-size: 1.8rem;
            color: var(--rose-gold);
            margin-bottom: 30px;
        }

        .paper-letter {
            background: var(--paper-bg);
            color: #2c2c2c;
            padding: 40px;
            border-radius: 5px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6),
                        inset 0 0 100px rgba(210, 180, 140, 0.3);
            position: relative;
            font-family: 'Aref Ruqaa', serif;
            line-height: 2.2;
            font-size: 1.3rem;
            border-left: 4px solid #d4a373;
        }

        .letter-header {
            font-size: 1.8rem;
            color: #8b0000;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* --- السهم والتفاعل الإضافي --- */
        .extra-section {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
        }

        .arrow-btn {
            background: none;
            border: none;
            color: var(--rose-gold);
            font-size: 1.2rem;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform 0.3s;
        }

        .arrow-btn:hover {
            transform: translateY(3px);
            color: #fff;
        }

        .hidden-love {
            margin-top: 20px;
            font-size: 2rem;
            color: var(--rose-gold);
            font-family: 'Aref Ruqaa', serif;
            opacity: 0;
            transition: opacity 0.8s ease;
            display: none;
        }

        .hidden-love.show {
            display: block;
            opacity: 1;
        }

        @media (max-width: 600px) {
            .timer-grid { grid-template-columns: repeat(2, 1fr); }
            .time-value { font-size: 1.8rem; }
            .header-title h1 { font-size: 2rem; }
            .paper-letter { padding: 25px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <!-- 1. شاشة الباسورد -->
    <div id="login-screen">
        <div class="login-card">
            <h2>حطي الباسورد</h2>
            <input type="password" id="passwordInput" placeholder="الباسورد هنا">
            <br>
            <button onclick="checkPassword()">ارسال</button>
            <div class="error-msg" id="errorMsg">كلمة السر غير صحيحة، حاولي مجدداً!</div>
        </div>
    </div>

    <!-- 2. المحتوى الرئيسي للموقع -->
    <div class="main-container" id="mainContent">
        
        <div class="header-title">
            <h1>كل سنة وأنتِ طيبة يا رنيم</h1>
            <p style="color: var(--rose-gold);">بداية حكايتنا: 18 أبريل 2026</p>
        </div>

        <div class="
